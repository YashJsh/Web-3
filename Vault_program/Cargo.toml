cargo-features = ["edition2024"]

[package]
name = "raw_sol"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = { version = "1.6.0", features = ["derive"] }
bytemuck = {version ="1.25.0", features=["derive"]}
pinocchio = "0.10.2"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.5.0"
solana-program-log = "1.1.0"
